name: Publicar Leer jugando

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar el juego
        run: npm test
      - name: Verificar audios
        run: npm run verificar
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos del sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -R css js assets audio _site/
          touch _site/.nojekyll
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: despliegue
        uses: actions/deploy-pages@v4
