<svg xmlns="http://www.w3.org/2000/svg" width="840" height="2110" viewBox="0 0 840 2110" role="img" aria-labelledby="title desc">
  <title id="title">Mi aventura de lectura</title>
  <desc id="desc">Propuesta visual de un mapa infantil con un camino que conecta las actividades de lectura. Un niño está junto al nivel d, después de doce actividades completadas. Cuatro actividades posteriores están bloqueadas.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff8e7"/><stop offset="1" stop-color="#edf6e4"/></linearGradient>
    <linearGradient id="green" x2="0" y2="1"><stop stop-color="#a3d99a"/><stop offset="1" stop-color="#65b880"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#69c9ec"/><stop offset="1" stop-color="#258dcd"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#23334b" flood-opacity=".16"/></filter>
    <g id="star"><path d="M0-12 3.7-4.2 12-3 6 3 7.5 11 0 7-7.5 11-6 3-12-3-3.7-4.2Z" fill="#ffd366" stroke="#e7a739" stroke-width="1.5" stroke-linejoin="round"/></g>
    <g id="stars"><use href="#star" x="-26"/><use href="#star"/><use href="#star" x="26"/></g>
    <g id="done"><circle r="46" fill="url(#green)" stroke="#fffdf4" stroke-width="7" filter="url(#shadow)"/><path d="M-29-22 Q-13-36 9-32" fill="none" stroke="#d5efc6" stroke-width="6" stroke-linecap="round"/></g>
    <g id="lock"><circle r="43" fill="#dbe1db" stroke="#fffdf4" stroke-width="7" filter="url(#shadow)"/><rect x="-14" y="-5" width="28" height="25" rx="6" fill="#98a5a3"/><path d="M-9-5v-8a9 9 0 0 1 18 0v8" fill="none" stroke="#98a5a3" stroke-width="5"/><circle cy="6" r="3" fill="#eaf0e8"/><path d="M0 7v6" stroke="#eaf0e8" stroke-width="3"/></g>
    <g id="tree"><ellipse cy="31" rx="35" ry="10" fill="#669b77" opacity=".12"/><path d="M0 9v22" stroke="#bc9263" stroke-width="10" stroke-linecap="round"/><path d="M-31 2C-44-17-26-36-13-33-16-54 18-59 26-36 48-28 44-4 28 6 12 17-14 17-31 2" fill="#a9d4a3"/><path d="M-19-18Q-9-30 3-27" stroke="#cbe7b9" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    <g id="flower"><path d="M0 0v19m0-6q-12-12-14-4m14 8q10-12 14-8" stroke="#83b588" stroke-width="3" fill="none"/><g fill="#fffaf1"><circle cy="-8" r="7"/><circle cx="8" cy="-2" r="7"/><circle cx="5" cy="7" r="7"/><circle cx="-5" cy="7" r="7"/><circle cx="-8" cy="-2" r="7"/></g><circle r="5" fill="#f1bf58"/></g>
    <g id="grass" stroke="#9ac39a" stroke-width="4" fill="none" stroke-linecap="round"><path d="M0 0-5-12M0 0 3-17M0 0 11-8"/></g>
    <g id="book"><path d="M-27-19Q-10-24 0-15 10-24 27-19v38Q10 14 0 23-10 14-27 19Z" fill="#fffdf4" stroke="#749d96" stroke-width="3"/><path d="M0-15v38" stroke="#749d96" stroke-width="3"/><path d="M-20-9-7-6m-13 6 13 3m14-9 13-3M7 3l13-3" stroke="#b7ccc3" stroke-width="3" stroke-linecap="round"/></g>
    <g id="child">
