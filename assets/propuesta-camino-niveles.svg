      <path d="M-18 82-28 85m50-3 10 3" stroke="#fffdf4" stroke-width="13" stroke-linecap="round"/>
      <rect x="-31" y="6" width="21" height="43" rx="10" fill="#e9a95c"/>
      <path d="M-16 17-32 35m48-18 18-18" stroke="#e7ac7d" stroke-width="13" stroke-linecap="round"/>
      <path d="M-21 19Q0 5 21 19l-3 38h-36Z" fill="#edab57"/><path d="M-11 19v33" stroke="#f8ce83" stroke-width="5" stroke-linecap="round"/>
      <rect x="-7" y="0" width="14" height="15" rx="5" fill="#e7ac7d"/>
      <circle cy="-17" r="26" fill="#efbb90"/><circle cx="-25" cy="-15" r="5" fill="#efbb90"/><circle cx="25" cy="-15" r="5" fill="#efbb90"/>
      <path d="M-26-18Q-33-48 0-49 31-47 27-17L18-31Q-4-20-18-31Z" fill="#624739"/>
